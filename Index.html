<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aurum Restaurant</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0b;
  color: white;
}

.hero {
  height: 100vh;
  background: url('https://images.unsplash.com/photo-1529692236671-f1f6cf9683ba') center/cover;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.hero-box {
  background: rgba(0,0,0,0.7);
  padding: 40px;
  border-radius: 20px;
}

h1 {
  font-size: 60px;
  margin: 0;
  color: gold;
}

button {
  margin-top: 20px;
  padding: 12px 25px;
  border: none;
  background: gold;
  color: black;
  font-weight: bold;
  border-radius: 30px;
  cursor: pointer;
}

.section {
  padding: 60px 20px;
  text-align: center;
}

.menu {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: #1a1a1a;
  border-radius: 15px;
  overflow: hidden;
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.card h3 {
  margin: 10px 0 5px;
}

footer {
  padding: 30px;
  text-align: center;
  border-top: 1px solid #333;
}
</style>

</head>

<body>

<div class="hero">
  <div class="hero-box">
    <h1>AURUM</h1>
    <p>Luxury Dining Experience</p>
    <button>Reserve a Table</button>
  </div>
</div>

<div class="section">
  <h2>About Us</h2>
  <p>We serve world-class luxury dishes crafted with passion and precision.</p>
</div>

<div class="section">
  <h2>Signature Menu</h2>

  <div class="menu">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1600891964092-4316c288032e"/>
      <h3>Wagyu Steak</h3>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1553621042-f6e147245754"/>
      <h3>Seafood Delight</h3>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1606313564200-e75d5e30476c"/>
      <h3>Chocolate Soufflé</h3>
    </div>

  </div>
</div>

<div class="section">
  <h2>Contact</h2>
  <p>📍 Lagos, Nigeria</p>
  <p>📞 +234 XXX XXX XXXX</p>
</div>

<footer>
  © 2026 Aurum Restaurant. All rights reserved.
</footer>

</body>
                                                                             </html>
